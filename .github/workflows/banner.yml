name: Live banner

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 min (GitHub may delay runs)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["banner/**", ".github/workflows/banner.yml"]

permissions:
  contents: write

concurrency:
  group: banner
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: banner/requirements.txt

      - run: pip install -r banner/requirements.txt

      - name: Render banner
        env:
          BANNER_LAT: ${{ secrets.BANNER_LAT }}
          BANNER_LON: ${{ secrets.BANNER_LON }}
        run: python banner/generate.py --out dist

      - name: Publish to output branch (single commit, no history)
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banner.svg
          git commit -q -m "banner $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
