name: Live banner

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["banner/**", ".github/workflows/banner.yml"]

permissions:
  contents: write

concurrency:
  group: banner
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      BANNER_ASSETS: ${{ github.workspace }}/.assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: banner/requirements.txt

      - run: pip install -r banner/requirements.txt

      - uses: actions/cache@v4
        with:
          path: .assets
          key: polyhaven-${{ hashFiles('banner/tools/fetch_assets.py', 'banner/forest_scene.py') }}

      - name: Fetch assets
        run: |
          if [ ! -d .assets/fir_tree_01 ]; then python banner/tools/fetch_assets.py .assets; fi

      - name: Render and publish every 30 minutes
        env:
          BANNER_LAT: ${{ secrets.BANNER_LAT }}
          BANNER_LON: ${{ secrets.BANNER_LON }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish() {
            rm -rf pub && mkdir pub && cp dist/banner.svg pub/
            cd pub
            git init -q -b output
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add banner.svg
            git commit -q -m "banner $(date -u +%FT%TZ)"
            git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
            cd ..
          }
          end=$(( $(date +%s) + 340 * 60 ))
          while [ $(date +%s) -lt $end ]; do
            python banner/generate.py --out dist && publish || echo "render failed"
            now=$(date +%s)
            sleep $(( 1800 - now % 1800 + 30 ))
          done
